name: CI/CD Pipeline for Demand Forecasting API

# push workflow to main branch
on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # pull latest code from main branch
    - name: 📥 Checkout Code
      uses: actions/checkout@v3

    # login to dockerhub with secrets
    - name: 🐳 Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # build and push docker image to dockerhub with tags
    - name: 🚀 Build and Push Docker Image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/retail-demand-api:latest