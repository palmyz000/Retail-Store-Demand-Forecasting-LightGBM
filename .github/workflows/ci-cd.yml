name: CI/CD Pipeline for Demand Forecasting API

# 1. กำหนดว่าให้ Workflow นี้ทำงานเมื่อมีการ Push โค้ดขึ้นไปที่ Branch 'main'
on:
  push:
    branches:
      - main # (ถ้าโปรเจกต์คุณใช้ชื่อ master ให้เปลี่ยนตรงนี้นะครับ)

jobs:
  build-and-push:
    runs-on: ubuntu-latest # ให้ GitHub เช่าเซิร์ฟเวอร์ Linux มารันงานนี้

    steps:
    # Step 1: ดึงโค้ดล่าสุดของคุณจาก GitHub ลงมาที่เซิร์ฟเวอร์
    - name: 📥 Checkout Code
      uses: actions/checkout@v3

    # Step 2: ล็อกอินเข้า Docker Hub โดยใช้กุญแจลับจาก Secrets
    - name: 🐳 Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Step 3: สั่ง Build Image และ Push ขึ้น Docker Hub อัตโนมัติ!
    - name: 🚀 Build and Push Docker Image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        # ตั้งชื่อ Image ให้มี Username นำหน้า ตามมาตรฐานของ Docker Hub
        tags: ${{ secrets.DOCKER_USERNAME }}/retail-demand-api:latest